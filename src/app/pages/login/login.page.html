<ion-content class="fondo-app">
  <!-- Indicador visual en todas las esperas con logo -->
  @if (cargando) {
    <div class="overlay-cargando">
      <div class="contenedor-spinner">
        <img src="assets/icon/logo_lamesa.png" alt="Logo de La Mesa" class="logo-spinner" />
        <div class="spinner-css"></div>
        <p>Autenticando usuario...</p>
      </div>
    </div>
  }

  <div class="contenedor-principal contenedor-app">
    <div class="cabecera-logo">
      <img src="assets/icon/logo_lamesa.png" alt="Logo de La Mesa" class="mascota-login" />
      <h1>La Mesa</h1>
    </div>

    <!-- Validacion de datos en todos los formularios -->
    <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()" class="formulario">
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" formControlName="correo" placeholder="ejemplo@correo.com" />
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <div class="input-con-icono">
          <input [type]="mostrarClave ? 'text' : 'password'" formControlName="clave" placeholder="Ingrese su clave" />
          <button type="button" class="boton-ojo" (click)="toggleMostrarClave()" [attr.aria-label]="mostrarClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <ion-icon [name]="mostrarClave ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>
    </form>
    <div class="enlace-registro">
      <span>¿Todavía no tenés cuenta?</span>
        <ion-button
          fill="clear"
          (click)="irARegistro()"
          class="boton-registro-link">
          Registrate como cliente
        </ion-button>
    </div>

    <!-- Accesos rápidos: componente externo, trae usuarios reales de la DB
         (corrección profesor 13-09) -->
    <app-accesos-rapidos (seleccionado)="onAccesoRapidoSeleccionado($event)"></app-accesos-rapidos>
  </div>

  <!-- Overlay, no adentro del flujo -- si empujara el resto del contenido
       hacia abajo, podría llegar a tapar el botón fijo de abajo
       (correcciones-profesor 13-09: ningún botón fijo puede generar
       scroll). -->
  @if (mensajeError) {
    <div class="mensaje-error">
      <ion-icon name="warning"></ion-icon>
      <span>{{ mensajeError }}</span>
    </div>
  }
</ion-content>

<!-- Fijo abajo (correcciones-profesor 13-09): antes vivía adentro del
     <form>, sin garantía de quedar siempre a mano. -->
<ion-footer class="pie-login">
  <button type="button" class="boton-principal" [disabled]="cargando || formularioLogin.invalid" (click)="iniciarSesion()">
    Iniciar sesión
  </button>
</ion-footer>
